# Model Selection Definitions
MODELS:
  ollama: "qwen2.5:7b"      # Default fast local model (100% GPU offload under 6GB VRAM)
  openai: "gpt-4o"
  gemini: "gemini-2.5-flash" # Default fast API model

# Pipeline Step Configurations
# You can specify the TYPE ('ollama', 'openai', or 'gemini') and optionally a specific 'MODEL_NAME' to override the default.
STEPS:
  EXTRACTION:
    TYPE: "ollama"
    MODEL_NAME: "qwen2.5:14b" # Hybrid/Spillover (Accurate schema parsing using 128GB RAM)
    # Secondary Options:
    # TYPE: "ollama" | MODEL_NAME: "qwen2.5:7b" (100% GPU, Fast but less schema-accurate)
    # TYPE: "gemini" | MODEL_NAME: "gemini-2.5-flash" (API, extremely fast and accurate)

  REFINEMENT:
    TYPE: "ollama"
    MODEL_NAME: "llama3.1:8b" # 100% GPU offload
    # Secondary Options:
    # TYPE: "ollama" | MODEL_NAME: "gemma4:26b" # Commented out (too large for 6GB VRAM local-only drafting, causes slow CPU spillover)

  MERGE:
    TYPE: "ollama"
    MODEL_NAME: "gemma2:27b" # High-reasoning spillover (Very precise merging using 128GB RAM)
    # Secondary Options:
    # TYPE: "gemini" | MODEL_NAME: "gemini-2.5-pro" (API, near-perfect deduplication)
    # TYPE: "ollama" | MODEL_NAME: "llama3.1:8b" (100% GPU, Fast but may drop complex structures)

  GAP_ANALYSIS:
    TYPE: "ollama"
    MODEL_NAME: "gemma2:27b" # High-reasoning spillover
    # Secondary Options:
    # TYPE: "ollama" | MODEL_NAME: "llama3.1:8b" (100% GPU)

  # CV Generator LangGraph Steps
  ANALYSIS:
    TYPE: "ollama"
    MODEL_NAME: "qwen2.5:7b" # 100% GPU offload, extremely fast
    # Secondary Options:
    # TYPE: "gemini" | MODEL_NAME: "gemini-2.5-flash" (API, near-instant)
    # Previous config differed:
    # TYPE: "openai"
    # MODEL_NAME: "gpt-4o"

  RETRIEVAL:
    TYPE: "ollama"
    MODEL_NAME: "llama3.1:8b" # 100% GPU offload, fast scoring per experience file
    # Secondary Options:
    # TYPE: "ollama" | MODEL_NAME: "qwen2.5:14b" (More nuanced conceptual bridging)
    # TYPE: "gemini" | MODEL_NAME: "gemini-2.5-flash" (API, fast & cheap)
    # Previous config differed:
    # TYPE: "openai"
    # MODEL_NAME: "gpt-4o"

  DRAFTING:
    TYPE: "gemini"
    MODEL_NAME: "gemini-2.5-pro" # RECOMMENDED: handles >30k token career context with massive window
    # Secondary Options:
    # TYPE: "ollama" | MODEL_NAME: "qwen2.5:14b" (Local, requires running with num_ctx=32768 in Ollama, relies on 128GB RAM)
    # Previous config differed:
    # TYPE: "openai"
    # MODEL_NAME: "gpt-4.1-mini"

  AUDIT:
    TYPE: "ollama"
    MODEL_NAME: "gemma2:9b" # Hybrid/Spillover (Strong local critic)
    # Secondary Options:
    # TYPE: "ollama" | MODEL_NAME: "gemma2:27b" (Excellent but slower local critic)
    # TYPE: "gemini" | MODEL_NAME: "gemini-2.5-pro" (API, exceptional recruiter-like critique)
    # Previous config differed:
    # TYPE: "openai"
    # MODEL_NAME: "gpt-4o"

  # Ingestion pipeline steps
  INGESTION_CLASSIFY:
    TYPE: "ollama"
    MODEL_NAME: "llama3.1:8b" # 100% GPU offload, extremely fast document triage
    # Secondary Options:
    # TYPE: "gemini" | MODEL_NAME: "gemini-2.5-flash" (API)
    # Previous config differed:
    # TYPE: "ollama"
    # MODEL_NAME: "gemma4:26b"

  INGESTION_EXTRACT:
    TYPE: "ollama"
    MODEL_NAME: "qwen2.5:14b" # Hybrid/Spillover (Handles structured JSON extraction beautifully)
    # Secondary Options:
    # TYPE: "gemini" | MODEL_NAME: "gemini-2.5-flash" (API, lightning fast & very precise)
    # Previous config differed:
    # TYPE: "openai"
    # MODEL_NAME: "gpt-4o"

  INGESTION_GENERATE:
    TYPE: "ollama"
    MODEL_NAME: "gemma2:27b" # High-reasoning spillover (Ensures strictly schema-compliant YAML frontmatter)
    # Secondary Options:
    # TYPE: "gemini" | MODEL_NAME: "gemini-2.5-pro" (API, perfect compliance)
    # Previous config differed:
    # TYPE: "openai"
    # MODEL_NAME: "gpt-4o"

  INGESTION_MERGE:
    TYPE: "ollama"
    MODEL_NAME: "gemma2:27b" # High-reasoning spillover
    # Secondary Options:
    # TYPE: "gemini" | MODEL_NAME: "gemini-2.5-pro" (API, perfect merging)
    # Previous config differed:
    # TYPE: "openai"
    # MODEL_NAME: "gpt-4o"

OLLAMA_BASE_URL: "http://localhost:11434"

# Workspace Paths & Directories
PATHS:
  WIKI_DIR: "llm-wiki"            # Canonical Knowledge Base SSoT directory
  OUTPUT_DIR: "output"   # Export directory for clean drafts and compiled PDF/DOCX

# Application & Generation Defaults
DEFAULTS:
  STRATEGY: "emea"                # Deterministic regional strategy (override via CLI --strategy)
  TRACK: "Corporate"              # Default professional domain track
  GENERATE_PDF: false             # Auto-compile PDF to OUTPUT_DIR
  GENERATE_DOCX: false            # Auto-compile DOCX to OUTPUT_DIR

# Backward compatibility aliases
TRACK_DEFAULT: "Corporate"
STRATEGY_DEFAULT: "emea"

# Experience Scoring & Selection Optimization
SCORING:
  FACTORS:
    ATS_SCORE: 0.50
    RECENCY: 0.30
    DURATION: 0.20
  DURATION_CAP_YEARS: 3.0
  RECENCY_HORIZON_YEARS: 15.0

  EMPLOYMENT_TYPE_MULTIPLIERS:
    Permanent: 1.00
    Startup / Co-Founder: 1.00
    Contract: 0.85
    Advisory: 0.75

  CULTURE_MULTIPLIERS:
    corporate:
      Permanent: 1.00
      Contract: 1.00
      Startup / Co-Founder: 0.80
      Advisory: 0.85
    startup:
      Permanent: 1.00
      Contract: 1.00
      Startup / Co-Founder: 1.10
      Advisory: 1.00

  TIERS:
    TIER_1_EXPANDED: 0.70
    TIER_2_BALANCED: 0.45
    TIER_3_COMPRESSED: 0.30
