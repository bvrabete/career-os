# Model Selection Definitions
MODELS:
  ollama: "qwen2.5:7b"      # Default fast local model (100% GPU offload under 6GB VRAM)
  openai: "o3-mini"

# Pipeline Step Configurations (Pure OpenAI-Assisted Setup)
# Optimized to run exclusively using an OpenAI API Key, leveraging the absolute latest models.
# Uses lightweight gpt-4o-mini for cost-efficient steps and o3-mini for high-reasoning tasks.
STEPS:
  EXTRACTION:
    TYPE: "openai"
    MODEL_NAME: "gpt-4o-mini" # Blazing fast, ultra-cheap schema parsing

  REFINEMENT:
    TYPE: "openai"
    MODEL_NAME: "gpt-4o-mini" # Cost-efficient narrative verification

  MERGE:
    TYPE: "openai"
    MODEL_NAME: "o3-mini" # Deep logical reasoning for timeline merging and deduplication

  GAP_ANALYSIS:
    TYPE: "openai"
    MODEL_NAME: "gpt-4o-mini" # Quick structural mismatch analysis

  # CV Generator LangGraph Steps
  ANALYSIS:
    TYPE: "openai"
    MODEL_NAME: "gpt-4o-mini" # Rapid region and intent analyzer

  RETRIEVAL:
    TYPE: "openai"
    MODEL_NAME: "gpt-4o-mini" # Fast semantic relevance scoring per experience

  DRAFTING:
    TYPE: "openai"
    MODEL_NAME: "o3-mini" # High-capacity, structured reasoning resume generator
    FALLBACK:
      TYPE: "openai"
      MODEL_NAME: "gpt-4o-mini"

  AUDIT:
    TYPE: "openai"
    MODEL_NAME: "o3-mini" # Brutally honest reasoning-model critic for ATS audit

  # Ingestion pipeline steps
  INGESTION_CLASSIFY:
    TYPE: "openai"
    MODEL_NAME: "gpt-4o-mini" # Fast document classification

  INGESTION_EXTRACT:
    TYPE: "openai"
    MODEL_NAME: "gpt-4o-mini" # Rapid extraction of candidate raw data

  INGESTION_GENERATE:
    TYPE: "openai"
    MODEL_NAME: "o3-mini" # Perfect schema compliance for frontmatter generation
    FALLBACK:
      TYPE: "openai"
      MODEL_NAME: "gpt-4o-mini"

  INGESTION_MERGE:
    TYPE: "openai"
    MODEL_NAME: "o3-mini" # Flawless deduplication of new experiences using logical reasoning

OLLAMA_BASE_URL: "http://localhost:11434"

# Workspace Paths & Directories
PATHS:
  WIKI_DIR: "llm-wiki"            # Canonical Knowledge Base SSoT directory
  OUTPUT_DIR: "output"   # Export directory for clean drafts and compiled PDF/DOCX

# Application & Generation Defaults
DEFAULTS:
  STRATEGY: "emea"                # Deterministic regional strategy (override via CLI --strategy)
  TRACK: "Corporate"              # Default professional domain track
  GENERATE_PDF: false             # Auto-compile PDF to OUTPUT_DIR
  GENERATE_DOCX: false            # Auto-compile DOCX to OUTPUT_DIR

# Backward compatibility aliases
TRACK_DEFAULT: "Corporate"
STRATEGY_DEFAULT: "emea"

# Experience Scoring & Selection Optimization
SCORING:
  FACTORS:
    ATS_SCORE: 0.50
    RECENCY: 0.30
    DURATION: 0.20
  DURATION_CAP_YEARS: 3.0
  RECENCY_HORIZON_YEARS: 15.0

  EMPLOYMENT_TYPE_MULTIPLIERS:
    Permanent: 1.00
    Startup / Co-Founder: 1.00
    Contract: 0.85
    Advisory: 0.75

  CULTURE_MULTIPLIERS:
    corporate:
      Permanent: 1.00
      Contract: 1.00
      Startup / Co-Founder: 0.80
      Advisory: 0.85
    startup:
      Permanent: 1.00
      Contract: 1.00
      Startup / Co-Founder: 1.10
      Advisory: 1.00

  TIERS:
    TIER_1_EXPANDED: 0.70
    TIER_2_BALANCED: 0.45
    TIER_3_COMPRESSED: 0.30
