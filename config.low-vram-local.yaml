# Model Selection Definitions
MODELS:
  ollama: "qwen2.5:7b"      # Default fast local model (100% GPU offload under 6GB VRAM)
  openai: "gpt-4o"
  gemini: "gemini-1.5-flash" # Default fast API model

# Pipeline Step Configurations (6GB VRAM Local-First Setup)
# Tailored to run entirely within 6GB GPU VRAM using llama3.1:8b and qwen2.5:7b,
# with drafting offloaded to Gemini-1.5-Pro for context handling.
STEPS:
  EXTRACTION:
    TYPE: "ollama"
    MODEL_NAME: "qwen2.5:7b" # Replaced 14b -> 7b (runs 100% on GPU under 6GB VRAM)

  REFINEMENT:
    TYPE: "ollama"
    MODEL_NAME: "llama3.1:8b" # Fits easily in 6GB VRAM

  MERGE:
    TYPE: "ollama"
    MODEL_NAME: "llama3.1:8b" # Replaced 27b -> 8b (prevents heavy CPU spillover)

  GAP_ANALYSIS:
    TYPE: "ollama"
    MODEL_NAME: "llama3.1:8b" # Replaced 27b -> 8b

  # CV Generator LangGraph Steps
  ANALYSIS:
    TYPE: "ollama"
    MODEL_NAME: "qwen2.5:7b" # Fits perfectly in VRAM, extremely fast

  RETRIEVAL:
    TYPE: "ollama"
    MODEL_NAME: "llama3.1:8b" # Fits perfectly in VRAM

  DRAFTING:
    TYPE: "gemini"
    MODEL_NAME: "gemini-1.5-pro" # RECOMMENDED: handles >30k token career context with massive window

  AUDIT:
    TYPE: "ollama"
    MODEL_NAME: "llama3.1:8b" # Replaced gemma2:9b with 8b for safety and speed on 6GB VRAM

  # Ingestion pipeline steps
  INGESTION_CLASSIFY:
    TYPE: "ollama"
    MODEL_NAME: "llama3.1:8b" # Fast local document classification

  INGESTION_EXTRACT:
    TYPE: "ollama"
    MODEL_NAME: "qwen2.5:7b" # Replaced 14b -> 7b

  INGESTION_GENERATE:
    TYPE: "ollama"
    MODEL_NAME: "llama3.1:8b" # Replaced 27b -> 8b

  INGESTION_MERGE:
    TYPE: "ollama"
    MODEL_NAME: "llama3.1:8b" # Replaced 27b -> 8b

OLLAMA_BASE_URL: "http://localhost:11434"

# Future configurations (e.g., prompt weights, track defaults)
TRACK_DEFAULT: "Corporate"
STRATEGY_DEFAULT: "emea"
