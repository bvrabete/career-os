[project]
name = "cv-generator"
version = "1.6.1"
description = "CV generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-community>=0.3.10",
    "langchain-core>=0.3.15",
    "langchain-ollama>=0.2.1",
    "langchain-openai>=0.2.12",
    "langgraph>=0.3.25",
    "markdown2>=2.5.5",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "transformers>=4.47.0",
    "weasyprint>=69.0",
    "langchain-google-genai",
]

[tool.uv]
package = true
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",  # Intel Mac
    "sys_platform == 'darwin' and platform_machine == 'arm64'",   # Apple Silicon
    "sys_platform == 'linux' and platform_machine == 'x86_64'",   # Linux / CI
    "sys_platform == 'win32' and platform_machine == 'AMD64'",    # Windows
]
constraint-dependencies = [
    # Pin to last version with a macOS 12 (Monterey) x86_64 wheel
    "faiss-cpu==1.9.0.post1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # docling-slim transitive dep — pin to last version compatible with macOS 12
    "pypdfium2<=5.10; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
kb-init = "kb_init:main"
kb-ingest = "kb_ingest:main"
cv-gen = "generate_cv:main"
doc-gen = "generate_document_cli:main"
ats-audit = "tools.kb_external_audit:main"
kb-cleanup = "kb_cleanup:main"
kb-skills-sync = "kb_skills_sync:main"

[dependency-groups]
dev = [
    {include-group = "notebooks"},
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
notebooks = [
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "jupyterlab>=4.0.0",
]
ingest = [
    "docling>=2.70.0",
    "langchain-docling>=2.0.0",
    "pypdf>=6.14.2",
]
ingest = [
    "docling>=2.70.0",
    "langchain-docling>=2.0.0",
    "pypdf>=6.14.2",
]

[tool.coverage.run]
relative_files = true
source = ["src"]
omit = [
    "src/generate_cv.py",
    "src/generate_document_cli.py",
    "src/kb_cleanup.py",
    "src/kb_ingest.py",
    "src/kb_skills_sync.py",
    "src/tools/**"
]
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
files = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line length handled separately / soft wraps
]
