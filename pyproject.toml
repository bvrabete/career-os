[project]
name = "cv-generator"
version = "1.4.1"
description = "CV generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5.23",
    "docling>=2.70.0",
    "faiss-cpu>=1.9.0.post1",
    "langchain>=1.3.11",
    "langchain-community>=0.3.10",
    "langchain-core>=0.3.15",
    "langchain-docling>=2.0.0",
    "langchain-ollama>=0.2.1",
    "langchain-openai>=0.2.12",
    "langflow>=1.10.0",
    "langgraph>=0.3.25",
    "markdown2>=2.5.5",
    "pypdf>=6.13.3",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "transformers>=4.47.0",
    "weasyprint>=68.1",
    "langchain-google-genai",
]

[tool.uv]
package = true

[project.scripts]
kb-ingest = "kb_ingest:main"
cv-gen = "generate_cv:main"
pdf-gen = "generate_pdf_cli:main"
kb-cleanup = "kb_cleanup:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
]

[tool.coverage.run]
relative_files = true
source = ["src"]
omit = [
    "src/generate_cv.py",
    "src/generate_pdf_cli.py",
    "src/kb_cleanup.py",
    "src/kb_ingest.py",
    "src/kb_ingest_graph.py",
    "src/cv_generator_graph.py",
    "src/pdf_generator.py"
]
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
