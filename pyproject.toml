[project]
name = "cv-generator"
version = "1.2.3"
description = "CV generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5.23",
    "docling>=2.70.0",
    "faiss-cpu>=1.9.0.post1",
    "langchain>=0.3.7",
    "langchain-community>=0.3.10",
    "langchain-core>=0.3.15",
    "langchain-docling>=2.0.0",
    "langchain-ollama>=0.2.1",
    "langchain-openai>=0.2.12",
    "langflow>=1.10.0",
    "langgraph>=0.3.25",
    "markdown2>=2.5.5",
    "pypdf>=6.13.3",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "transformers>=4.47.0",
    "weasyprint>=68.1",
]

[tool.uv]
package = true

[project.scripts]
cv-gen = "generate_cv:main"
kb-ingest = "kb_ingest:main"
pdf-gen = "generate_pdf_cli:main"
