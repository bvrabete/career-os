# Model Selection Definitions
MODELS:
  ollama: "qwen2.5:7b"         # Default fast local model (100% GPU offload under 6GB VRAM)
  gemini: "gemini-2.5-flash"    # Default fast API model
  gemini_pro: "gemini-2.5-pro"  # High-reasoning executive drafting & audit model
  gemini_lite: "gemini-2.5-flash-lite" # Ultra-low latency classification model

# Pipeline Step Configurations (Pure Gemini-Assisted Setup)
# Optimized to run exclusively using a Google Gemini API Key, leveraging the latest models.
# Uses lightweight gemini-2.5-flash/flash-lite for speed/cost efficiency and gemini-2.5-pro for high-reasoning tasks.
STEPS:
  EXTRACTION:
    TYPE: "gemini"
    MODEL_NAME: "gemini-2.5-flash" # Blazing fast, zero VRAM schema parsing

  REFINEMENT:
    TYPE: "gemini"
    MODEL_NAME: "gemini-2.5-flash" # Cost-efficient narrative verification & budget compression

  MERGE:
    TYPE: "gemini"
    MODEL_NAME: "gemini-2.5-pro" # High-reasoning enterprise deduplication and syncing

  GAP_ANALYSIS:
    TYPE: "gemini"
    MODEL_NAME: "gemini-2.5-flash" # Fast structural mismatch analysis

  # CV Generator LangGraph Steps
  ANALYSIS:
    TYPE: "gemini"
    MODEL_NAME: "gemini-2.5-flash" # Rapid region and intent analyzer

  RETRIEVAL:
    TYPE: "gemini"
    MODEL_NAME: "gemini-2.5-flash" # Fast semantic relevance scoring per experience

  DRAFTING:
    TYPE: "gemini"
    MODEL_NAME: "gemini-2.5-pro" # High-fidelity executive drafting with 1M context window

  AUDIT:
    TYPE: "gemini"
    MODEL_NAME: "gemini-2.5-pro" # Senior recruiter critic & strict ATS gap analysis

  # Ingestion pipeline steps
  INGESTION_CLASSIFY:
    TYPE: "gemini"
    MODEL_NAME: "gemini-2.5-flash-lite" # Ultra-fast, cost-efficient document classification

  INGESTION_EXTRACT:
    TYPE: "gemini"
    MODEL_NAME: "gemini-2.5-flash" # Flawless extraction of candidate raw data

  INGESTION_GENERATE:
    TYPE: "gemini"
    MODEL_NAME: "gemini-2.5-flash" # Fast, high-fidelity schema-compliant frontmatter generation

  INGESTION_MERGE:
    TYPE: "gemini"
    MODEL_NAME: "gemini-2.5-pro" # High-reasoning deduplication of experiences into existing nodes

OLLAMA_BASE_URL: "http://localhost:11434"

# Workspace Paths & Directories
PATHS:
  WIKI_DIR: "llm-wiki"            # Canonical Knowledge Base SSoT directory
  OUTPUT_DIR: "ai-generated-cvs"   # Export directory for clean drafts and compiled PDF/DOCX

# Application & Generation Defaults
DEFAULTS:
  STRATEGY: "emea"                # Deterministic regional strategy (override via CLI --strategy)
  TRACK: "Corporate"              # Default professional domain track
  GENERATE_PDF: false             # Auto-compile PDF to OUTPUT_DIR
  GENERATE_DOCX: false            # Auto-compile DOCX to OUTPUT_DIR

# Backward compatibility aliases
TRACK_DEFAULT: "Corporate"
STRATEGY_DEFAULT: "emea"

# Experience Scoring & Selection Optimization
SCORING:
  FACTORS:
    ATS_SCORE: 0.50
    RECENCY: 0.30
    DURATION: 0.20
  DURATION_CAP_YEARS: 3.0
  RECENCY_HORIZON_YEARS: 15.0

  EMPLOYMENT_TYPE_MULTIPLIERS:
    Permanent: 1.00
    Startup / Co-Founder: 1.00
    Contract: 0.85
    Advisory: 0.75

  CULTURE_MULTIPLIERS:
    corporate:
      Permanent: 1.00
      Contract: 1.00
      Startup / Co-Founder: 0.80
      Advisory: 0.85
    startup:
      Permanent: 1.00
      Contract: 1.00
      Startup / Co-Founder: 1.10
      Advisory: 1.00

  TIERS:
    TIER_1_EXPANDED: 0.70
    TIER_2_BALANCED: 0.45
    TIER_3_COMPRESSED: 0.30
